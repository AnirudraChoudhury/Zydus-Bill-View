name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: zydus-bill-view
        run: npm ci

      - name: Build and export Next.js (static)
        env:
          # Provide the public API URL to the client build
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        working-directory: zydus-bill-view
        run: |
          npm run build
          # Export static files to the `out` directory so Pages can serve them
          npx next export -o out

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './zydus-bill-view/out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4